[frontend]
# Show only English results when the browser first loads.
default_english_only = true

# Select these sources when the browser first loads.
# Allowed values: acled, gdelt, guardian, mediacloud, newsapi, nyt.
default_sources = ["guardian", "nyt"]

[cache]
# Keep each search result in memory for this many seconds.
ttl_seconds = 300

# Store no more than this many search results in memory.
max_entries = 100
