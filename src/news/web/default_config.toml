[frontend]
# Show all languages when no operator configuration is present.
default_english_only = false

# Start with no preselected credential-dependent providers.
# Allowed values: acled, gdelt, guardian, mediacloud, newsapi, nyt.
default_sources = []

[cache]
# Keep an in-memory search result for this many seconds.
ttl_seconds = 300

# Store at most this many in-memory search results.
max_entries = 100
