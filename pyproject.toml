[project]
name = "news"
version = "0.1.0"
description = "Historical multi-source news search engine with a FastAPI backend and browser frontend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.41.0",
]

[project.scripts]
news-server = "news.api.app:main"
news-search = "news.cli.workflow:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"news.web" = ["default_config.toml", "static/*.html", "static/*.css", "static/*.svg", "static/scripts/*.js"]

[dependency-groups]
dev = [
    "ruff>=0.11.13",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# E, F  pycodestyle errors and pyflakes: the ruff defaults.
# I     import sorting, so import order is decided by the tool and never by hand.
# UP    pyupgrade: rewrite syntax that a newer Python supersedes, for example
#       typing.Sequence becoming collections.abc.Sequence.
# B     flake8-bugbear: mutable default arguments and similar footguns.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Calling Depends() and Query() in a parameter default is how FastAPI declares
# dependencies and query parameters, so B008 does not apply to them.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
# Without this ruff files "news" and "tests" as third-party packages and drops
# the blank line that separates this project's imports from installed ones.
known-first-party = ["news", "tests"]
