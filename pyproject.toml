[project]
name = "news"
version = "0.1.0"
description = "Historical multi-source news search engine with a FastAPI backend and browser frontend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.41.0",
]

[project.scripts]
news-server = "news.api.app:main"
news-search = "news.cli.workflow:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"news.web" = ["default_config.toml", "static/*.html", "static/*.css", "static/*.svg", "static/scripts/*.js"]

[dependency-groups]
dev = [
    "ruff>=0.11.13",
]
