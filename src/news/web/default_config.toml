[frontend]
# Show every language when no operator settings are present.
default_english_only = false

# Start with no preselected sources that need credentials.
# Allowed values: acled, gdelt, guardian, mediacloud, newsapi, nyt.
default_sources = []

[cache]
# Keep each search result in memory for this many seconds.
ttl_seconds = 300

# Store no more than this many search results in memory.
max_entries = 100

[security]
# Believe proxy headers when reading the client address and HTTPS state.
# Keep this false unless a reverse proxy you control sits in front.
trust_forwarded_headers = false

[trends]
# Shortest gap in seconds between two Google Trends requests. Google rate
# limits these unofficial endpoints hard, so requests are spaced instead of
# sent in a burst. Raise it if HTTP 429 still appears.
seconds_between_requests = 4.0

# Geography used when a trends request does not name one.
# Empty string means worldwide; otherwise a country code such as US, CA, GB,
# optionally with a region suffix such as US-NY.
default_geo = ""
