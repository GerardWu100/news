services:
  news:
    build: .
    image: local/news:latest
    container_name: news
    ports:
      - "127.0.0.1:50023:8000"
    restart: unless-stopped
    # Serve as your own account so the mounted data directory stays writable.
    # Find the values with 'id -u' and 'id -g' and set them in .env.
    user: "${NEWS_UID:-1000}:${NEWS_GID:-1000}"
    # The application writes only to the mounted data directory.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: America/Toronto
      NEWS_DATA_DIR: /data
      NEWS_CONFIG: /data/config.toml
      # Sign-in accounts. Without one complete account the server answers
      # nothing. The numbered slots are optional extra people.
      UI_USERNAME: ${UI_USERNAME:-}
      UI_PASSWORD: ${UI_PASSWORD:-}
      UI_USERNAME_2: ${UI_USERNAME_2:-}
      UI_PASSWORD_2: ${UI_PASSWORD_2:-}
      UI_USERNAME_3: ${UI_USERNAME_3:-}
      UI_PASSWORD_3: ${UI_PASSWORD_3:-}
      NYT_API_KEY: ${NYT_API_KEY:-}
      NYT_API_SECRET: ${NYT_API_SECRET:-}
      MEDIACLOUD_API_KEY: ${MEDIACLOUD_API_KEY:-}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-}
      GUARDIAN_API_KEY: ${GUARDIAN_API_KEY:-}
      ACLED_OAUTH_TOKEN_URL: ${ACLED_OAUTH_TOKEN_URL:-https://acleddata.com/oauth/token}
      ACLED_OAUTH_GRANT_TYPE: ${ACLED_OAUTH_GRANT_TYPE:-password}
      ACLED_OAUTH_CLIENT_ID: ${ACLED_OAUTH_CLIENT_ID:-acled}
      ACLED_USERNAME: ${ACLED_USERNAME:-}
      ACLED_PASSWORD: ${ACLED_PASSWORD:-}
      ACLED_BEARER_TOKEN: ${ACLED_BEARER_TOKEN:-}
      ACLED_BEARER_TOKEN_TYPE: ${ACLED_BEARER_TOKEN_TYPE:-Bearer}
      ACLED_BEARER_EXPIRES_IN: ${ACLED_BEARER_EXPIRES_IN:-}
      ACLED_REFRESH_TOKEN: ${ACLED_REFRESH_TOKEN:-}
      ACLED_BEARER_OBTAINED_AT_UTC: ${ACLED_BEARER_OBTAINED_AT_UTC:-}
    volumes:
      # Left of the colon is the folder on your machine, set by
      # NEWS_DATA_HOST_DIR in .env and defaulting to ${HOME}/.containers/news.
      # Right of the colon is the path inside the container, which the
      # application reads through NEWS_DATA_DIR above and must stay /data.
      - ${NEWS_DATA_HOST_DIR:-${HOME}/.containers/news}:/data
    networks:
      - single
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  news-cli:
    profiles:
      - cli
    build: .
    image: local/news:latest
    entrypoint:
      - news-search
    user: "${NEWS_UID:-1000}:${NEWS_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NEWS_SERVER_URL: http://news:8000
      # The command line signs in with the first browser account.
      UI_USERNAME: ${UI_USERNAME:-}
      UI_PASSWORD: ${UI_PASSWORD:-}
    networks:
      - single

networks:
  single:
    external: true
